[project]
name = "pinchana-core"
version = "26.9.5"
description = "Shared models, storage, and VPN controller for scraper services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0,<2.0.0",
    "tenacity>=9.1.4",
    "yt-dlp[default,deno]>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
