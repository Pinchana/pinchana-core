[project]
name = "pinchana-core"
version = "26.9.7"
description = "Shared models, storage, and VPN controller for scraper services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "starlette>=1.8.0,<2.0.0",
    "tenacity>=9.2.1",
    "yt-dlp[default,deno]>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
